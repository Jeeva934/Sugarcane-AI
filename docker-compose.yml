services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sugarcane
      POSTGRES_USER: sugarcane
      POSTGRES_PASSWORD: sugarcane
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sugarcane -d sugarcane"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
